<form class="form" id="contact-form" method="POST" action="mailer.php">
                        <div class="field">
                            <label for="contact-name">Your name</label>
                            <input id="contact-name" name="name" type="text" autocomplete="name" required>
                        </div>
                        <div class="field">
                            <label for="contact-email">Email</label>
                            <input id="contact-email" name="email" type="email" autocomplete="email" required>
                        </div>
                        <div class="field">
                            <label for="contact-phone">Phone (optional)</label>
                            <input id="contact-phone" name="phone" type="tel" autocomplete="tel">
                        </div>
                        <div class="field">
                            <label for="contact-subject">Subject</label>
                            <input id="contact-subject" name="subject" type="text">
                        </div>
                        <div class="field field--full">
                            <label for="contact-message">How can I help?</label>
                            <textarea id="contact-message" name="message" required></textarea>
                        </div>
                        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
                        <div class="field--full">
                            <button class="btn btn--primary" type="submit"><span class="btn-text">Send Message</span> <i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                        <p class="form__note" id="form-note" role="status" aria-live="polite"></p>
                    </form>
